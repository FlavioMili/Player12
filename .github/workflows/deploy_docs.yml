name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'include/**'
      - 'docs/**'
      - 'Doxyfile'
      - 'scripts/build_website_docs.py'
      - 'scripts/optimize_website.cjs'
      - 'scripts/requirements-docs.txt'
      - '*.md'
      - '.github/workflows/deploy_docs.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: main

      - name: Checkout website branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: website
          path: website

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz

      - name: Install documentation build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/player12-docs"
          "$RUNNER_TEMP/player12-docs/bin/pip" install -r main/scripts/requirements-docs.txt
          npm --prefix "$RUNNER_TEMP/player12-web-tools" install --ignore-scripts --no-audit --no-fund \
            terser@5.51.2 clean-css@5.3.3 html-minifier-terser@7.2.0

      - name: Build Doxygen Documentation
        run: |
          cd main
          doxygen Doxyfile

      - name: Test documentation renderer
        working-directory: main
        run: '"$RUNNER_TEMP/player12-docs/bin/python" -B -m unittest discover -s test -p "test_website_docs.py"'

      - name: Copy Doxygen Output to Website
        run: |
          # Clean old api docs and copy new ones
          rm -rf website/api
          cp -r main/docs/html website/api

      - name: Render readable guides and compress publication
        run: |
          # The showcase/CSS/media stay owned by the website branch. The
          # renderer updates guides without republishing raw duplicate assets.
          test -f website/scripts/check_site.py
          "$RUNNER_TEMP/player12-docs/bin/python" main/scripts/build_website_docs.py \
            --source main --site website
          node main/scripts/optimize_website.cjs website \
            "$RUNNER_TEMP/player12-web-tools/node_modules"
          python3 website/scripts/check_site.py

      - name: Commit and Push to website
        run: |
          cd website
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "docs: auto-deploy doxygen api and sync markdown files" || echo "No changes to commit"
          git push origin website
